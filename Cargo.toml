[workspace]
resolver = "2"
members = ["crates/prune-core", "crates/prune-cli", "src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/bonjin-app/prune"
authors = ["Prune contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Build scripts and procedural macros run on the build machine and never ship. Stripping a
# procedural macro's library can leave rustc unable to load it ("can't find crate for
# `ctor_proc_macro`"), which the strip in recent macOS toolchains does; the shipped binaries
# above are still stripped.
[profile.release.build-override]
strip = false
