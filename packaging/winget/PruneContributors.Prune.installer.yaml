# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json

PackageIdentifier: PruneContributors.Prune
PackageVersion: 0.2.5
Platform:
- Windows.Desktop
# The compatibility table in the README says Windows 10, and nothing narrower has been tested,
# so this claims no more than that.
MinimumOSVersion: 10.0.0.0
UpgradeBehavior: install
ReleaseDate: 2026-11-15
# Only the MSI is listed. winget marks the NSIS installer as downloaded from the internet and
# starts it through ShellExecute, which holds an unsigned program at a security prompt; on an
# unattended install nobody answers it, so the installer never starts and winget waits forever.
# Given both, winget picks the NSIS installer even without --scope user. The MSI goes through
# Windows Installer, which does not prompt. Signed with a certificate from a public authority,
# the NSIS installer would not be held: see RELEASING.md and
# https://github.com/bonjin-app/prune/issues/1
Installers:
# The MSI sets ALLUSERS=1, so it installs for the machine and elevates. ProductCode is read out
# of the package itself by scripts/update-winget.sh: WiX generates a new one for every build.
- Architecture: x64
  InstallerType: wix
  Scope: machine
  InstallerLocale: en-US
  InstallerUrl: https://github.com/bonjin-app/prune/releases/download/v0.2.5/Prune_0.2.5_x64_en-US.msi
  InstallerSha256: 6B55BE6313803AEA676803F6A3966A85270FFEFF01250E2A79907F4D96B2E059
  ProductCode: '{6A60B834-0194-4D70-A95F-D5749F68D7A1}'
ManifestType: installer
ManifestVersion: 1.10.0
