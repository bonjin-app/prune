<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2a22"/>
      <stop offset="1" stop-color="#0b1210"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="224" fill="url(#bg)"/>
  <!-- main branch -->
  <path d="M512 880 C 512 700, 512 560, 512 300" stroke="#e7f5ea" stroke-width="56" stroke-linecap="round" fill="none"/>
  <!-- living side branch with leaf -->
  <path d="M512 560 C 560 520, 620 500, 690 470" stroke="#e7f5ea" stroke-width="44" stroke-linecap="round" fill="none"/>
  <path d="M690 470 C 760 380, 860 380, 880 300 C 780 290, 700 330, 690 470 Z" fill="url(#leaf)"/>
  <!-- pruned stub (dead branch removed) -->
  <path d="M512 420 C 470 400, 440 380, 400 360" stroke="#e7f5ea" stroke-width="44" stroke-linecap="round" fill="none"/>
  <!-- cut mark -->
  <path d="M356 300 L 444 420" stroke="#f87171" stroke-width="30" stroke-linecap="round"/>
  <path d="M444 300 L 356 420" stroke="#f87171" stroke-width="30" stroke-linecap="round"/>
  <!-- top leaf -->
  <path d="M512 300 C 500 200, 560 130, 640 120 C 640 210, 590 290, 512 300 Z" fill="url(#leaf)"/>
</svg>
