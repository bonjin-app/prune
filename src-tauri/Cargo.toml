[package]
name = "prune"
description = "Prune — open-source system utility for macOS and Windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "prune_lib"
# Plain rlib. Tauri's template ships `staticlib` + `cdylib` for iOS and Android; Prune is a
# desktop application and builds neither. On Windows the `cdylib` made `tests/ipc.rs` link
# against `prune_lib.dll` instead of the library, and the test binary then failed to start at
# all — `STATUS_ENTRYPOINT_NOT_FOUND`, before a single test ran. Both consumers, `main.rs` and
# the integration test, want an ordinary Rust library.
crate-type = ["rlib"]

# Not `prune`: `crates/prune-cli` already produces a binary of that name, and two targets in one
# workspace writing the same file means the last build silently wins. Cargo warns about it, and
# the result is a `target/release/prune` that is the desktop app on one machine and the command
# line on another. The command line keeps the short name because that is what a user types; this
# one is only ever seen inside `Prune.app`, where `tauri.conf.json` says what to look for.
[[bin]]
name = "prune-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[dependencies]
prune-core = { path = "../crates/prune-core" }
tauri = { version = "2", features = [] }
# Remembering the window and refusing a second copy are desktop-app manners, not access:
# neither plugin can see anything the user's data.
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono.workspace = true
rayon = "1"
