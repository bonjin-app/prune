# Checks the WinGet manifests the way the winget-pkgs pull request template asks for, on the
# only kind of machine that can: `winget validate` and `winget install` are Windows programs,
# so neither can be run where the manifests are written.
#
# Run it by hand before submitting a release to microsoft/winget-pkgs.
name: WinGet manifests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/winget/**"
      - ".github/workflows/winget-validate.yml"

jobs:
  validate:
    name: Validate and install
    runs-on: windows-latest
    # A hung installer is the likely failure here, and the default six-hour timeout turns that
    # into a very slow way of finding out.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The runner image may or may not carry winget. Installing it unconditionally fails on
      # the images that do: the installer action ships an older Microsoft.UI.Xaml than the one
      # already present, and Windows refuses to install a package over a newer version.
      - name: Look for winget
        id: find
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            "present=true" >> $env:GITHUB_OUTPUT
            winget --version
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            "winget is not on this image; installing it" | Write-Host
          }

      - name: Install winget
        if: steps.find.outputs.present != 'true'
        uses: Cyberboss/install-winget@v1

      - name: winget --version
        run: winget --version

      - name: Validate the manifests
        run: winget validate --manifest packaging/winget

      # Installing from a file on disk is off by default, for the obvious reason: a manifest can
      # point anywhere. The runner is an administrator, so it can turn it on.
      - name: Allow installing from a local manifest
        run: winget settings --enable LocalManifestFiles

      # Installing proves the manifest points at something that actually installs, which is the
      # half of the pull request checklist that validation alone does not cover.
      # --silent, not the default SilentWithProgress: the runner has no interactive desktop for
      # an installer's progress window to appear on, and one that waits for it never returns.
      #
      # Only the MSI is exercised, because only the MSI is in the manifest. Putting the NSIS
      # installer back means re-adding it here as well; see issue #1.
      - name: Install the MSI (machine scope)
        timeout-minutes: 8
        run: >
          winget install --manifest packaging/winget --scope machine --silent --verbose-logs
          --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Show what was installed
        run: winget list --name Prune --accept-source-agreements --disable-interactivity

      - name: Uninstall the MSI
        run: winget uninstall --name Prune --silent --disable-interactivity

      # winget's own logs say what an installer did, and are the only way to see inside one
      # that failed or hung.
      - name: Keep winget's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winget-logs
          path: ~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir
          if-no-files-found: warn
