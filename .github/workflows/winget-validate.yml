# Checks the WinGet manifests the way the winget-pkgs pull request template asks for, on the
# only kind of machine that can: `winget validate` and `winget install` are Windows programs,
# so neither can be run where the manifests are written.
#
# Run it by hand before submitting a release to microsoft/winget-pkgs.
name: WinGet manifests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/winget/**"
      - ".github/workflows/winget-validate.yml"

jobs:
  validate:
    name: Validate and install
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The runner image may or may not carry winget. Installing it unconditionally fails on
      # the images that do: the installer action ships an older Microsoft.UI.Xaml than the one
      # already present, and Windows refuses to install a package over a newer version.
      - name: Look for winget
        id: find
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            "present=true" >> $env:GITHUB_OUTPUT
            winget --version
          } else {
            "present=false" >> $env:GITHUB_OUTPUT
            "winget is not on this image; installing it" | Write-Host
          }

      - name: Install winget
        if: steps.find.outputs.present != 'true'
        uses: Cyberboss/install-winget@v1

      - name: winget --version
        run: winget --version

      - name: Validate the manifests
        run: winget validate --manifest packaging/winget

      # Installing proves the manifest points at something that actually installs, which is the
      # half of the pull request checklist that validation alone does not cover.
      - name: Install from the manifest
        run: >
          winget install --manifest packaging/winget
          --accept-package-agreements --accept-source-agreements --disable-interactivity

      - name: Show what was installed
        run: winget list --name Prune

      - name: Uninstall
        run: winget uninstall --name Prune --disable-interactivity
