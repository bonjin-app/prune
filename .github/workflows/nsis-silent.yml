# Can the Windows installer install without anyone at the keyboard?
#
# That is how winget installs it, how a fleet deployment installs it, and how Microsoft's own
# validation pipeline installs it. `winget install` hung here with no output, so this runs the
# installer directly and, if it does not finish, says what it was doing.
name: Silent install (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to test
        default: "0.1.3"

jobs:
  silent:
    name: Install with /S
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download the installer
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $url = "https://github.com/bonjin-app/prune/releases/download/v$v/Prune_${v}_x64-setup.exe"
          Write-Host "downloading $url"
          Invoke-WebRequest $url -OutFile setup.exe
          Get-Item setup.exe | Format-List Name, Length

      # The installer itself returns in seconds, so what winget waited on has to be something
      # the installer left running. Tauri's NSIS starts the application when it finishes.
      - name: /S — does it leave the app running?
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(120000)) { Write-Host "installer itself hung"; exit 1 }
          Write-Host "installer exited with $($p.ExitCode)"
          Start-Sleep -Seconds 5
          $app = Get-Process prune-desktop -ErrorAction SilentlyContinue
          if ($app) {
            Write-Host "LEFT RUNNING: prune-desktop pid $($app.Id -join ', ')"
            Stop-Process -Name prune-desktop -Force
          } else {
            Write-Host "nothing left running"
          }

      - name: Uninstall before the second attempt
        shell: pwsh
        run: |
          $u = "$env:LOCALAPPDATA\Prune\uninstall.exe"
          if (Test-Path $u) {
            $p = Start-Process -FilePath $u -ArgumentList '/S' -PassThru
            $null = $p.WaitForExit(120000)
            Write-Host "uninstaller exited with $($p.ExitCode)"
          }
          Start-Sleep -Seconds 3

      # Tauri's NSIS documents /NS as "do not start the application afterwards".
      - name: /S /NS — does that stop it?
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S','/NS' -PassThru
          if (-not $p.WaitForExit(120000)) { Write-Host "installer itself hung"; exit 1 }
          Write-Host "installer exited with $($p.ExitCode)"
          Start-Sleep -Seconds 5
          $app = Get-Process prune-desktop -ErrorAction SilentlyContinue
          if ($app) {
            Write-Host "STILL LEFT RUNNING: prune-desktop pid $($app.Id -join ', ')"
            Stop-Process -Name prune-desktop -Force
            exit 1
          }
          Write-Host "nothing left running"

      - name: What landed on disk
        if: always()
        shell: pwsh
        run: |
          foreach ($d in @("$env:LOCALAPPDATA\Prune", "$env:PROGRAMFILES\Prune")) {
            if (Test-Path $d) { Write-Host "--- $d ---"; Get-ChildItem $d | Select-Object Name }
          }
