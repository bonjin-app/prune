# Does the Windows installer install with nobody at the keyboard?
#
# That is how a fleet deployment installs it, and it is the baseline the winget hang in
# issue #1 is measured against: this passes, and `winget install` of the same file does not.
# If this ever starts failing, the two problems are not the same problem.
name: Silent install (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to test
        default: "0.1.3"

jobs:
  silent:
    name: Install with /S
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download the installer
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $url = "https://github.com/bonjin-app/prune/releases/download/v$v/Prune_${v}_x64-setup.exe"
          Write-Host "downloading $url"
          Invoke-WebRequest $url -OutFile setup.exe

      - name: Install
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(120000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "the installer did not finish within two minutes"
          }
          if ($p.ExitCode -ne 0) { throw "the installer exited with $($p.ExitCode)" }
          Write-Host "installed, exit 0"

      - name: It installed where it said it would
        shell: pwsh
        run: |
          # installMode is currentUser, so this belongs under the user's own directory and
          # nowhere else.
          $user = "$env:LOCALAPPDATA\Prune\prune-desktop.exe"
          if (-not (Test-Path $user)) { throw "not installed at $user" }
          if (Test-Path "$env:PROGRAMFILES\Prune") { throw "a currentUser install wrote to Program Files" }
          Get-Item $user | Select-Object FullName, Length

      - name: It leaves nothing running
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $app = Get-Process prune-desktop -ErrorAction SilentlyContinue
          if ($app) {
            Stop-Process -Name prune-desktop -Force
            throw "the installer left the application running"
          }
          Write-Host "nothing left running"

      - name: Uninstall
        shell: pwsh
        run: |
          $u = "$env:LOCALAPPDATA\Prune\uninstall.exe"
          $p = Start-Process -FilePath $u -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(120000)) { throw "the uninstaller did not finish" }
          if ($p.ExitCode -ne 0) { throw "the uninstaller exited with $($p.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path "$env:LOCALAPPDATA\Prune\prune-desktop.exe") { throw "the application is still installed" }
          Write-Host "uninstalled cleanly"
