# Can the Windows installer install without anyone at the keyboard?
#
# That is how winget installs it, how a fleet deployment installs it, and how Microsoft's own
# validation pipeline installs it. `winget install` hung here with no output, so this runs the
# installer directly and, if it does not finish, says what it was doing.
name: Silent install (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to test
        default: "0.1.3"

jobs:
  silent:
    name: Install with /S
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download the installer
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $url = "https://github.com/bonjin-app/prune/releases/download/v$v/Prune_${v}_x64-setup.exe"
          Write-Host "downloading $url"
          Invoke-WebRequest $url -OutFile setup.exe
          Get-Item setup.exe | Format-List Name, Length

      # winget hangs waiting for this installer even on a clean machine, while the installer
      # process itself returns in seconds. So something it starts outlives it: winget waits on
      # the whole tree, Start-Process -Wait does not. This lists what is still there.
      - name: What does /S leave behind?
        shell: pwsh
        run: |
          $before = (Get-CimInstance Win32_Process | Select-Object -ExpandProperty ProcessId)
          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(120000)) { Write-Host "the installer itself hung"; exit 1 }
          Write-Host "installer exited with $($p.ExitCode)"
          Start-Sleep -Seconds 10
          Write-Host "--- processes that exist now and did not before ---"
          Get-CimInstance Win32_Process |
            Where-Object { $before -notcontains $_.ProcessId } |
            Select-Object ProcessId, ParentProcessId, Name, CommandLine |
            Format-List
          Write-Host "--- anything still holding the installer or its folder ---"
          Get-CimInstance Win32_Process |
            Where-Object { $_.CommandLine -and ($_.CommandLine -match 'setup|Prune|nsis|webview' ) } |
            Select-Object ProcessId, Name, CommandLine | Format-List

      - name: What landed on disk
        if: always()
        shell: pwsh
        run: |
          foreach ($d in @("$env:LOCALAPPDATA\Prune", "$env:PROGRAMFILES\Prune")) {
            if (Test-Path $d) { Write-Host "--- $d ---"; Get-ChildItem $d | Select-Object Name }
          }
