# Can the Windows installer install without anyone at the keyboard?
#
# That is how winget installs it, how a fleet deployment installs it, and how Microsoft's own
# validation pipeline installs it. `winget install` hung here with no output, so this runs the
# installer directly and, if it does not finish, says what it was doing.
name: Silent install (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Released version to test
        default: "0.1.3"

jobs:
  silent:
    name: Install with /S
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download the installer
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          $url = "https://github.com/bonjin-app/prune/releases/download/v$v/Prune_${v}_x64-setup.exe"
          Write-Host "downloading $url"
          Invoke-WebRequest $url -OutFile setup.exe
          Get-Item setup.exe | Format-List Name, Length

      - name: Run it silently, and say what happens if it does not return
        shell: pwsh
        run: |
          $p = Start-Process -FilePath .\setup.exe -ArgumentList '/S' -PassThru
          Write-Host "started pid $($p.Id)"
          if ($p.WaitForExit(120000)) {
            Write-Host "exited with $($p.ExitCode) after $([int]((Get-Date) - $p.StartTime).TotalSeconds)s"
            if ($p.ExitCode -ne 0) { exit 1 }
          } else {
            Write-Host "--- still running after 120s; this is the hang ---"
            Write-Host "--- processes started since the installer ---"
            Get-CimInstance Win32_Process |
              Where-Object { $_.CreationDate -ge $p.StartTime } |
              Select-Object ProcessId, ParentProcessId, Name, CommandLine |
              Format-List
            Write-Host "--- any window it is waiting on ---"
            Get-Process | Where-Object { $_.MainWindowTitle } |
              Select-Object Id, ProcessName, MainWindowTitle | Format-Table -AutoSize
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

      - name: What landed on disk
        if: always()
        shell: pwsh
        run: |
          foreach ($d in @("$env:LOCALAPPDATA\Prune", "$env:PROGRAMFILES\Prune")) {
            if (Test-Path $d) { Write-Host "--- $d ---"; Get-ChildItem $d -Recurse -Depth 1 | Select-Object FullName }
          }
