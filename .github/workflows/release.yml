name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The desktop bundles. Creates (or reuses) the draft release for the tag.
  release:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            args: --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      # A secret that was never set arrives as an empty string, not as nothing at all. Passing
      # `APPLE_CERTIFICATE=""` straight to the build makes it try to import an empty certificate
      # and fail the whole thing — which is what happened the first time this workflow ran, on
      # both macOS jobs, while Windows sailed through. So whether to sign is decided here and
      # the variables are only set when there is something to set.
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Sign, if there is a certificate to sign with
        if: env.HAS_APPLE_CERTIFICATE == 'true'
        shell: bash
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prune ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The `prune` command line, attached to the same release. Built after the bundles so the
  # draft release already exists.
  cli:
    name: CLI (${{ matrix.name }})
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: cli-${{ matrix.target }}
      - run: cargo build -p prune-cli --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          dir="target/${{ matrix.target }}/release"
          name="prune-${tag}-${{ matrix.target }}"
          # Each platform produces one archive, and the upload below names exactly that one.
          # Naming both shapes there instead meant every job asked for a file it had not made,
          # and `gh release upload` treats a pattern that matches nothing as an error — so the
          # command line never reached a release on any platform until this was found.
          if [ -f "$dir/prune.exe" ]; then
            7z a "$name.zip" "./$dir/prune.exe" ./LICENSE ./README.md
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            tar -czf "$name.tar.gz" -C "$dir" prune -C "$GITHUB_WORKSPACE" LICENSE README.md
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "$ARCHIVE" --clobber
