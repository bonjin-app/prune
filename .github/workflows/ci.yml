name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # `tauri::generate_context!` reads tauri.conf.json and needs the frontend output to
      # exist. The IPC tests use Tauri's mock context, so an empty placeholder is enough.
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p dist && echo "<!doctype html><title>ci</title>" > dist/index.html
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Prune's central promise is that it never talks to a network. A dependency bump is the
      # easiest way for that to stop being true without anyone noticing.
      - name: No network dependencies
        shell: bash
        run: ./scripts/check-no-network.sh

  build:
    name: Build (${{ matrix.name }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: cargo clippy -p prune --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo clippy -p prune-cli --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build (no bundle)
        run: pnpm tauri build --debug --no-bundle --target ${{ matrix.target }}
