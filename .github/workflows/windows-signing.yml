# Does Windows signing work, before there is a certificate to sign a release with?
#
# Runs the release workflow's signing path with a throwaway self-signed certificate: import it,
# build, check the installers and the application inside each are signed, then install the
# signed installer silently and check what it installed.
#
# What this cannot show is issue #1. winget marks a download as coming from the internet and
# starts it through ShellExecute, which holds an unsigned program at a prompt nobody answers on
# an unattended install. On a GitHub Windows runner, marked that way, a program signed through a
# public certificate authority (PuTTY's plink) ran at once, while Prune's installer was held
# unsigned and equally held signed by a self-signed certificate, even one trusted as a root and
# as a publisher. So only a certificate from a public authority gets past that prompt, and this
# test certificate proves the wiring, not that.
name: Windows signing

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/windows-signing.ps1"
      - "scripts/check-windows-signatures.ps1"
      - ".github/workflows/windows-signing.yml"
      - "src-tauri/tauri.conf.json"

permissions:
  contents: read

jobs:
  sign:
    name: Sign with a test certificate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: windows-signing
      - run: pnpm install --frozen-lockfile

      # Made here, exported the way a real one is stored as a secret, then taken back out of the
      # store, so the script under test has to import it itself.
      - name: Make a test certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Prune signing test' `
            -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(2)
          $password = [guid]::NewGuid().ToString()
          $pfx = Join-Path $env:RUNNER_TEMP 'test.pfx'
          $cer = Join-Path $env:RUNNER_TEMP 'test.cer'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          # The machine store, because adding to the user's trusted roots asks for confirmation.
          Import-Certificate -FilePath $cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Remove-Item $cert.PSPath
          "::add-mask::$password"
          "WINDOWS_CERTIFICATE=$([Convert]::ToBase64String([IO.File]::ReadAllBytes($pfx)))" >> $env:GITHUB_ENV
          "WINDOWS_CERTIFICATE_PASSWORD=$password" >> $env:GITHUB_ENV
          Remove-Item $pfx

      - name: Sign Windows builds
        shell: pwsh
        run: ./scripts/windows-signing.ps1

      - name: Build
        run: pnpm tauri build

      - name: Check the signatures
        shell: pwsh
        run: ./scripts/check-windows-signatures.ps1 target/release

      - name: Install the signed installer
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'The installer did not finish within two minutes.' }
          if ($p.ExitCode -ne 0) { throw "The installer exited with $($p.ExitCode)." }
          foreach ($f in 'prune-desktop.exe', 'uninstall.exe') {
            $path = "$env:LOCALAPPDATA\Prune\$f"
            if (-not (Test-Path $path)) { throw "Nothing was installed at $path." }
            $s = Get-AuthenticodeSignature $path
            Write-Host ('{0,-14} installed {1}' -f $s.Status, $f)
            if ($s.Status -ne 'Valid') { throw "The installed $f is not signed: $($s.Status)." }
          }

      - name: Uninstall
        shell: pwsh
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Prune\uninstall.exe" -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The uninstaller exited with $($p.ExitCode)." }
          Start-Sleep -Seconds 3
          if (Test-Path "$env:LOCALAPPDATA\Prune\prune-desktop.exe") { throw 'Still installed.' }
