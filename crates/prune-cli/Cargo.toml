[package]
name = "prune-cli"
description = "Prune on the command line: scan, clean, analyze — same engine, same safety rules."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "prune"
path = "src/main.rs"

[lib]
name = "prune_cli"
path = "src/lib.rs"

[dependencies]
prune-core = { path = "../prune-core" }
clap = { version = "4", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
dirs = "6"

[dev-dependencies]
tempfile = "3"
